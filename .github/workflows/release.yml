name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish assets to, for example v0.1.3
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: macos-15-intel
            target: macos-x64
          - runner: macos-14
            target: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/connect/package-lock.json

      - name: Install core dependencies
        run: bun install --frozen-lockfile

      - name: Install bundled connect runtime
        run: npm --prefix ./runtime/connect ci --omit=dev

      - name: Build compiled CLI
        run: bun run compile

      - name: Package release archive
        run: ./scripts/package-release.sh ${{ matrix.target }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mya-${{ matrix.target }}
          path: release/*.tar.gz

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: release/*.tar.gz
          overwrite_files: true
